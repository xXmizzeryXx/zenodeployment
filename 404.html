<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — ZENO</title>
<script>
  const t=localStorage.getItem('zeno_theme')||'default';
  const a=localStorage.getItem('zeno_accent')||'#00f5ff';
  document.documentElement.className='theme-'+t;
  document.documentElement.style.setProperty('--accent',a);
</script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/zeno-v2-core.css">
<style>
body{background:transparent;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative}
.err-panel{text-align:center;padding:48px 40px;max-width:520px}
.err-label{font-family:var(--font-display);font-size:10px;letter-spacing:6px;color:var(--muted);margin-bottom:16px}
.err-digits{display:flex;gap:8px;justify-content:center;align-items:center;margin:20px 0}
.err-digit{font-family:var(--font-display);font-size:clamp(80px,18vw,140px);font-weight:900;line-height:1;color:var(--accent);text-shadow:0 0 40px var(--accent-glow);position:relative}
.err-digit.glitch-a{animation:glitchA 2.5s infinite}
.err-digit.glitch-b{animation:glitchB 2.8s infinite 0.3s}
.err-digit.glitch-c{animation:glitchC 3.1s infinite 0.6s}
@keyframes glitchA{0%,90%,100%{transform:translate(0)}92%{transform:translate(-3px,2px);clip-path:inset(20% 0 60% 0)}94%{transform:translate(3px,-2px)}}
@keyframes glitchB{0%,88%,100%{transform:translate(0)}90%{transform:translate(2px,-3px);clip-path:inset(40% 0 30% 0)}93%{transform:translate(-2px,1px)}}
@keyframes glitchC{0%,91%,100%{transform:translate(0)}93%{transform:translate(-2px,-2px);clip-path:inset(10% 0 70% 0)}95%{transform:translate(4px,2px)}}
.err-msg{color:var(--muted);font-size:16px;line-height:1.6;margin-bottom:28px}
.err-msg span{color:var(--accent)}
.btn-group{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.err-ai{margin-top:32px;padding:14px 18px;border-radius:var(--radius);display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);max-width:400px}
.err-ai i{color:var(--accent)}
.err-ai strong{font-family:var(--font-display);font-size:9px;letter-spacing:2px;display:block;color:var(--muted);margin-bottom:4px}
.logo-badge{position:fixed;top:20px;left:24px;font-family:var(--font-display);font-size:12px;font-weight:900;letter-spacing:6px;color:var(--accent);text-decoration:none;z-index:10}
.status-bar{position:fixed;bottom:22px;display:flex;gap:2rem;z-index:10}
.status-item{font-family:var(--font-display);font-size:8px;letter-spacing:2px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status-dot{width:5px;height:5px;border-radius:50%;background:var(--accent2)}
.status-dot.ok{background:#00ff88;box-shadow:0 0 6px #00ff88}
.theme-glass .err-panel{background:var(--surface);backdrop-filter:var(--surface-blur);border:1px solid var(--surface-border);border-radius:var(--radius-lg)}
</style>
</head>
<body>
<div id="zeno-wallpaper"></div>
<div id="zeno-grid" class="show"></div>
<div id="zeno-scanlines" class="show"></div>

<a href="index.html" class="logo-badge" onclick="navigateTo('index.html');return false">ZENO</a>

<div class="zeno-surface err-panel">
  <div class="err-label">SIGNAL LOST</div>
  <div class="err-digits">
    <span class="err-digit glitch-a">4</span>
    <span class="err-digit glitch-b">0</span>
    <span class="err-digit glitch-c">4</span>
  </div>
  <p class="err-msg">The page you're looking for has <span>vanished from the grid.</span></p>
  <div class="btn-group">
    <button class="zeno-btn" onclick="navigateTo('index.html')"><i class="fa-solid fa-house"></i> RETURN HOME</button>
    <button class="zeno-btn zeno-btn-ghost" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i> GO BACK</button>
  </div>
  <div class="zeno-surface err-ai">
    <i class="fa-solid fa-robot"></i>
    <div><strong>ZENO AI SUGGESTS:</strong>Try navigating home or checking your games library.</div>
  </div>
</div>

<div class="status-bar">
  <div class="status-item"><div class="status-dot"></div> ERROR 404</div>
  <div class="status-item"><div class="status-dot ok"></div> SYSTEM ONLINE</div>
  <div class="status-item"><div class="status-dot ok"></div> ECLIPSE SUITE</div>
</div>

<script src="js/zeno-v2-core.js"></script>
<script>applyWallpaper(); applyTheme(ZenoStore.theme, ZenoStore.accent);</script>
</body>
</html>
