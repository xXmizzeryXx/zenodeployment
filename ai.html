<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENO V2 — AI</title>
<script>
  const t=localStorage.getItem('zeno_theme')||'default';
  const a=localStorage.getItem('zeno_accent')||'#00f5ff';
  document.documentElement.className='theme-'+t;
  document.documentElement.style.setProperty('--accent',a);
  if(!localStorage.getItem('zeno_v2_setup_complete'))location.replace('onboarding.html');
</script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/zeno-v2-core.css">
<style>
.ai-page{display:flex;flex-direction:column;height:calc(100vh - 56px)}
.ai-top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--surface-border);font-family:var(--font-mono);font-size:12px}
.ai-top .path{flex:1;color:var(--muted)}
.ai-top select,.ai-top button{font-family:var(--font-mono);font-size:11px;padding:6px 10px;background:var(--surface);border:1px solid var(--surface-border);color:var(--text);border-radius:var(--radius);cursor:pointer}
.ai-chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.ai-chat .msg{max-width:85%;padding:12px 16px;border-radius:var(--radius);font-size:14px;line-height:1.55}
.ai-chat .msg.user{align-self:flex-end;background:rgba(0,245,255,0.1);border:1px solid var(--accent)}
.ai-chat .msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--surface-border)}
.ai-chat .msg.bot pre{background:rgba(0,0,0,0.4);padding:10px;border-radius:6px;overflow-x:auto;font-family:var(--font-mono);font-size:12px}
.ai-input-bar{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--surface-border)}
.ai-input-bar textarea{flex:1;min-height:44px;max-height:160px;resize:none}
#keyModal .zeno-modal{max-width:420px}
</style>
</head>
<body>
<div id="zeno-wallpaper"></div>
<div id="zeno-grid"></div>
<div id="zeno-scanlines"></div>

<div class="ai-page">
  <div class="ai-top">
    <span class="path">zeno@eclipse / ai</span>
    <select id="aiModelSel">
      <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
      <option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>
      <option value="mixtral-8x7b-32768">mixtral-8x7b-32768</option>
    </select>
    <span id="tokenLbl" style="color:var(--muted);font-size:10px"></span>
    <button type="button" id="btnClear"><i class="fa-solid fa-trash"></i> CLEAR</button>
    <button type="button" id="btnExport"><i class="fa-solid fa-download"></i> EXPORT</button>
  </div>
  <div class="ai-chat" id="aiChat"></div>
  <div class="ai-input-bar">
    <textarea class="zeno-input" id="aiInput" placeholder="Message ZENO AI... (Enter to send, Shift+Enter for newline)"></textarea>
    <button class="zeno-btn" id="aiSend"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
</div>

<div id="keyModal" class="zeno-modal-overlay open">
  <div class="zeno-modal">
    <div class="zeno-modal-title">GROQ API KEY</div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px">Get a free key at <a href="https://console.groq.com" target="_blank" rel="noopener" style="color:var(--accent)">console.groq.com</a></p>
    <input type="password" class="zeno-input" id="groqKeyIn" placeholder="gsk_...">
    <button class="zeno-btn" style="margin-top:16px;width:100%" id="groqKeySave">SAVE</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="js/zeno-v2-core.js"></script>
<script>
zenoBoot({ page: 'ai', nav: 'AI', lock: false, ai: false });
initNavBar('AI');

const chat = document.getElementById('aiChat');
const modelSel = document.getElementById('aiModelSel');
modelSel.value = ZenoStore.aiModel;
modelSel.onchange = () => ZenoStore.set('zeno_ai_model', modelSel.value);

if (ZenoStore.groqKey) ZenoModal.close('keyModal');
else ZenoModal.bind('keyModal');

document.getElementById('groqKeySave').onclick = () => {
  const k = document.getElementById('groqKeyIn').value.trim();
  if (k) { ZenoStore.set('zeno_groq_key', k); ZenoModal.close('keyModal'); }
};

function addMsg(role, text, isError) {
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'bot') + (isError ? ' error' : '');
  if (role === 'assistant' && typeof marked !== 'undefined') d.innerHTML = marked.parse(text);
  else d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const inp = document.getElementById('aiInput');
  const msg = inp.value.trim();
  if (!msg) return;
  inp.value = '';
  addMsg('user', msg);
  addMsg('assistant', '...');
  const pending = chat.lastChild;
  const r = await ZenoAI.send(msg, 'ai', { availableActions: [] });
  pending.remove();
  addMsg('assistant', r.text, r.error);
}

document.getElementById('aiSend').onclick = send;
document.getElementById('aiInput').onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
};
document.getElementById('btnClear').onclick = () => { ZenoAI.history = []; chat.innerHTML = ''; };
document.getElementById('btnExport').onclick = () => {
  const txt = ZenoAI.history.map((m) => m.role.toUpperCase() + ': ' + m.content).join('\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
  a.download = 'zeno-ai-chat.txt';
  a.click();
};

ZenoAI.registerHandler('navigate', (a) => navigateTo(a.target));
</script>
</body>
</html>
