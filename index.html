<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ZENO is shut down for the summer." />
<title>ZENO — Summer Shutdown</title>
<script>
  (() => {
    const accent = localStorage.getItem('zeno_accent') || '#ffd86f';
    document.documentElement.style.setProperty('--accent', accent);
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  color-scheme: dark;
  --accent: #ffd86f;
  --bg: #070311;
  --text: #fdf7ed;
  --muted: rgba(253, 247, 237, 0.78);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Plus Jakarta Sans', 'Rajdhani', sans-serif;
  background: radial-gradient(circle at top, rgba(22, 7, 46, 0.85), var(--bg));
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 48px 20px;
}

.shutdown-card {
  max-width: 520px;
  width: 100%;
  padding: 48px 40px;
  border-radius: 28px;
  background: rgba(6, 4, 18, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 30px 120px rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(30px);
}

.shutdown-card i {
  font-size: clamp(3rem, 12vw, 4.5rem);
  color: var(--accent);
  margin-bottom: 18px;
}

.shutdown-card h1 {
  font-family: 'Orbitron', 'Rajdhani', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: clamp(1.6rem, 6vw, 2.6rem);
  margin: 0 0 12px;
}

.shutdown-card p {
  margin: 0;
  color: var(--muted);
  font-size: 1rem;
}

.shutdown-card a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}

@media (max-width: 520px) {
  .shutdown-card {
    padding: 36px 24px;
  }
}
</style>
</head>
<body>
  <div class="shutdown-card">
    <i class="fa-solid fa-sun"></i>
    <h1>ZENO shut down for the summer</h1>
    <p>For more information join the <a href="https://discord.gg/ZPtrVXU42n" target="_blank" rel="noopener">Discord</a>.<br>
    For an alternative, use <a href="https://craftedgamz.com" target="_blank" rel="noopener">Crafted Gamz</a>.</p>
  </div>
</body>
</html>
